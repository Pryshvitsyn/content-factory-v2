name: Content Factory V2.11 Sphere Motion CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/v2.11/**"
      - "scripts/impulseoff-sphere-motion-master.js"
      - "tests/v2.11-sphere-motion-master-test.js"
      - "package.json"
      - ".github/workflows/v2.11-sphere-motion-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/v2.11/**"
      - "scripts/impulseoff-sphere-motion-master.js"
      - "tests/v2.11-sphere-motion-master-test.js"
      - "package.json"
      - ".github/workflows/v2.11-sphere-motion-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 7

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        timeout-minutes: 3

      - name: Run V2.11 sphere motion certification
        env:
          LIVE_PAID_GENERATION: "false"
          PAID_PROVIDER_CALLS: "0"
          EXTERNAL_GENERATION_CALLS: "0"
        run: npm run test:v2.11
        timeout-minutes: 3
