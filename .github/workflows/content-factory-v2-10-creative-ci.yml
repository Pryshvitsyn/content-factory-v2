name: Content Factory V2.10 Creative Production CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-factory-v2-10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_PAID_GENERATION: "false"
  PAID_PROVIDER_CALLS: "0"
  EXTERNAL_GENERATION_CALLS: "0"

jobs:
  creative-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: V2.10 creative contracts and mocked provider boundary
        run: npm run test:v2.10
      - name: QUALITY script-first director contract
        run: node tests/quality-script-first-test.js
      - name: V2.10.1 quality evidence reconciliation and paid asset recovery
        run: npm run test:v2.10.1
      - name: V2.10.2 reference geometry and bounded source recovery
        run: npm run test:v2.10.2
      - name: V2.10.3 incremental cross-shot continuity and safe reference orientation
        run: npm run test:v2.10.3
      - name: V2.10.4.1 isolated bounded source recovery execution
        run: npm run test:v2.10.4.1
      - name: Locked-keyframe bounded workflow
        run: npm run test:locked-keyframe
      - name: V2.10.1 exact-identity recovered continuation
        run: node tests/v2.10.1-v210-resume-identity-test.js
      - name: Real LiveProductionService collision guard
        run: node tests/v2.10-live-production-collision-guard-test.js
      - name: Real local FFmpeg end-title renderer
        run: node tests/v2.1-ffmpeg-master-renderer-test.js
      - name: Certified regression suites
        run: |
          npm run test:v2.9.2
          npm run test:v2.9
          npm run test:v2.8
          npm run test:v2.7
          npm run test:v2.5
      - name: Dashboard production build
        run: npm run dashboard:build
      - name: Paid provider execution remains disabled in CI
        run: |
          test "$LIVE_PAID_GENERATION" = "false"
          test "$PAID_PROVIDER_CALLS" = "0"
          test "$EXTERNAL_GENERATION_CALLS" = "0"

  postgres-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_factory_v210_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: content_factory_v210_test
      CONTENT_FACTORY_TEST_DATABASE: "1"
      LIVE_PAID_GENERATION: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: V2.10 PostgreSQL ownership, immutability, idempotency, fingerprint, isolation
        run: npm run test:v2.10:postgres
      - name: V2.10.2 PostgreSQL immutable lineage, retry bound, and exact-job continuation
        run: npm run test:v2.10.2:postgres
      - name: V2.10.4 PostgreSQL creative lineage, one-attempt bound, and exact-job continuation
        run: npm run test:v2.10.4:postgres
      - name: Locked-keyframe PostgreSQL durability
        run: |
          createdb --maintenance-db=postgres locked_keyframe_test
          PGDATABASE=locked_keyframe_test CONTENT_FACTORY_TEST_DATABASE=1 npm run test:locked-keyframe:postgres
      - name: QUALITY script-first PostgreSQL approvals and pilot gate
        run: |
          createdb --maintenance-db=postgres quality_script_first_test
          PGDATABASE=quality_script_first_test CONTENT_FACTORY_TEST_DATABASE=1 node tests/quality-script-first-postgres-test.js
