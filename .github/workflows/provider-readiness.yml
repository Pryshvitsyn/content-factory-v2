name: Provider readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  LIVE_PAID_GENERATION: 'false'
  PAID_PROVIDER_CALLS: '0'
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:provider-readiness
      - run: npm run test:v2.10
      - run: npm run test:v2.5
      - run: npm run test:v2.9.2
      - run: npm run dashboard:build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provider_readiness_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: provider_readiness_test
      CONTENT_FACTORY_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/v2.5-postgres-integration-test.js
      - name: Pilot service and review lifecycle on PostgreSQL 17
        run: node tests/quality-script-first-postgres-test.js
