name: V2.1 Planning Database Boundary

on:
  push:
    branches:
      - 'feature/v2.1-planning-*'
      - 'develop/**'
  pull_request:
    branches:
      - main
      - 'develop/**'
      - 'feature/v2.1-*'

jobs:
  planning-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: n8n
          POSTGRES_DB: content_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U n8n -d content_os"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: content_os
      PGUSER: n8n
      PGPASSWORD: n8n
      NVIDIA_MODEL: smoke-test-model
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply V2.1 database migrations
        run: |
          set -euo pipefail
          for migration in \
            migrations/20260815_v2_1_foundation.sql \
            migrations/20260815_v2_1_multi_business.sql \
            migrations/20260815_v2_1_production_boundary.sql \
            migrations/20260815_v2_1_execution_engine.sql \
            migrations/20260816_v2_1_production_scoped_job_claim.sql \
            migrations/20260816_v2_1_database_contract_hardening.sql \
            migrations/20260816_v2_1_bible_db_contract.sql \
            migrations/20260816_v2_1_planning_db_contract.sql
          do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -f "$migration"
          done
      - name: Verify clean V2.1 migration contract
        run: node tests/v2.1-migration-contract-db-smoke.js
      - name: Verify planning engine syntax
        run: |
          node --check worker/v2.1-planning-engine.js
          node --check worker/v2.1-shot-plan.js
          node --check worker/v2.1-asset-plan.js
          node --check worker/v2.1-production-orchestrator.js
      - name: Verify planning unit contracts
        run: node --test tests/v2.1-planning.test.js tests/v2.1-production-contract.test.js
      - name: Verify planning database boundary
        run: node tests/v2.1-planning-db-smoke.js
