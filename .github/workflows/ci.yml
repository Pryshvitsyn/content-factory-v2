name: Content Factory V2 CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "develop/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check worker syntax
        run: |
          node --check worker/factory-worker-v2.js
          node --check worker/v2.1-production-contract.js
          node --check worker/v2.1-execution-engine.js

      - name: Run V2.1 execution foundation tests
        run: npm run test:v2.1

      - name: Check smoke test syntax
        run: node --check tests/smoke-test.js

      - name: Check build script syntax
        run: bash -n build-v2.sh

      - name: Check migrations
        run: |
          test -s migrations/001_v2.sql
          test -s migrations/002_v2_1_execution.sql
          test -s migrations/003_v2_1_execution_contract_fix.sql
          test -s tests/v2.1-database-contract.sql

      - name: Check required project files
        run: |
          test -s package.json
          test -s package-lock.json
          test -s README.md
          test -s .env.example

      - name: Check Git whitespace
        run: git diff --check
