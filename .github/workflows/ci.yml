name: Content Factory V2 CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "develop/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "release/**"
      - "develop/**"
      - "feat/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d content_os"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check worker syntax
        run: |
          node --check worker/factory-worker-v2.js
          node --check worker/v2.1-production-contract.js
          node --check worker/v2.1-execution-engine.js
          node --check worker/v2.2-production-orchestrator.js
          node --check worker/v2.2-stage-spec.js
          node --check worker/v2.2-artifact-contract.js
          node --check worker/v2.3-quality-engine.js
          node --check worker/v2.4-production-brain.js
          node --check worker/v2.4-production-brain-executor.js

      - name: Run V2.1 execution foundation tests
        run: npm run test:v2.1

      - name: Run PostgreSQL execution and concurrency certification
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: content_os
        run: node tests/v2.1-postgres-certification.js

      - name: Run autonomous production contract certification
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: content_os
        run: node tests/v2.1-production-contract-certification.js

      - name: Run V2.2 production vertical slice certification
        run: npm run test:v2.2

      - name: Run V2.3 quality engine certification
        run: node tests/v2.3-quality-engine-test.js

      - name: Run V2.4 production brain certification
        run: node tests/v2.4-production-brain-test.js

      - name: Run V2.4 production brain executor certification
        run: node tests/v2.4-production-brain-executor-test.js

      - name: Check smoke test syntax
        run: node --check tests/smoke-test.js

      - name: Check build script syntax
        run: bash -n build-v2.sh

      - name: Check migrations
        run: |
          test -s migrations/001_v2.sql
          test -s migrations/002_v2_1_execution.sql
          test -s migrations/003_v2_1_execution_contract_fix.sql
          test -s migrations/004_v2_1_retry_attempt_contract.sql
          test -s migrations/002_content_production_contract.sql
          test -s tests/v2.1-database-contract.sql
          test -s tests/v2.1-postgres-certification.js
          test -s tests/v2.1-production-contract-certification.js
          test -s tests/v2.2-production-orchestrator-test.js
          test -s tests/v2.2-stage-spec-test.js
          test -s tests/v2.2-artifact-contract-test.js
          test -s tests/v2.3-quality-engine-test.js
          test -s tests/v2.4-production-brain-test.js
          test -s tests/v2.4-production-brain-executor-test.js

      - name: Check required project files
        run: |
          test -s package.json
          test -s package-lock.json
          test -s README.md
          test -s .env.example

      - name: Check Git whitespace
        run: git diff --check
