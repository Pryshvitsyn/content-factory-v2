name: Content Factory V2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
      - "develop/**"
    paths:
      - "src/**"
      - "worker/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "build-v2.sh"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "worker/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "build-v2.sh"
      - ".github/workflows/**"
      - "README.md"

concurrency:
  group: content-factory-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: content_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: content_os

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Guard against committed secret patterns
        shell: bash
        run: |
          set -euo pipefail
          matches=0
          scan_pattern() {
            local label="$1"
            local pattern="$2"
            if git grep -nI -E -e "$pattern" -- ':!package-lock.json' ':!.gitignore' ':!.env.example' ':!README.md' ':!docs/**'; then
              echo "ERROR: potential $label detected in tracked repository content."
              matches=1
            fi
          }
          scan_pattern 'private key' '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
          scan_pattern 'OpenAI-style secret key' '\bsk-[A-Za-z0-9_-]{20,}\b'
          scan_pattern 'NVIDIA API key' '\bnvapi-[A-Za-z0-9_-]{20,}\b'
          scan_pattern 'AWS access key' '\bAKIA[0-9A-Z]{16}\b'
          scan_pattern 'GitHub token' '\bgh[pousr]_[A-Za-z0-9_]{20,}\b'
          scan_pattern 'database URL with embedded password' 'postgres(ql)?://[^[:space:]/:]+:[^[:space:]@]+@'
          if [ "$matches" -ne 0 ]; then exit 1; fi
          echo 'Secret-pattern guard passed.'
        timeout-minutes: 2

      - name: Check worker syntax
        run: |
          for file in worker/*.js; do node --check "$file"; done
        timeout-minutes: 2

      - name: Check V2.1 runtime contracts
        run: |
          node --check src/providers/provider-contract.js
          node --check src/providers/provider-registry.js
          node --check src/providers/provider-gateway.js
          node --check worker/v2.1-production-contract.js
          node --check worker/v2.1-production-orchestrator.js
          node --check worker/v2.1-structured-production.js
          node --check worker/v2.1-asset-orchestrator.js
          node --check worker/v2.1-media-generation.js
          node --check worker/v2.1-execution-engine.js
          node --check worker/v2.1-stage-runner.js
          node --check worker/v2.1-pipeline-executor.js
          node --check worker/v2.1-recovery-executor.js
          node --check src/artifacts/artifact-service.js
          node --check src/storage/storage-adapter.js
          node --check src/v2.1/asset-repository.js
          node --check src/v2.1/reconciliation.js
          node --check src/v2.1/validation-engine.js
          node --check src/v2.1/publish-executor.js
          node --check tests/v2.1-provider-contract-test.js
          node --check tests/v2.1-production-orchestrator-test.js
          node --check tests/v2.1-provider-artifact-integration-test.js
          node --check tests/v2.1-provider-routing-test.js
          node --check tests/v2.1-provider-availability-test.js
          node --check tests/v2.1-single-stage-execution-certification.js
          node --check tests/v2.1-pipeline-executor-test.js
          node --check tests/v2.1-stage-runner-integration-test.js
          node --check tests/v2.1-stage-runner-postgres-integration-test.js
          node --check tests/v2.1-multi-stage-integration-test.js
          node --check tests/v2.1-multi-stage-postgres-integration-test.js
          node --check tests/v2.1-retry-recovery-postgres-integration-test.js
          node --check tests/v2.1-concurrency-postgres-certification.js
          node --check tests/v2.1-lease-fencing-postgres-certification.js
          node --check tests/v2.1-artifact-idempotency-test.js
          node --check tests/v2.1-crash-consistency-test.js
          node --check tests/v2.1-postgres-crash-recovery-certification.js
          node --check tests/v2.1-reconciliation-test.js
          node --check tests/v2.1-recovery-executor-test.js
          node --check tests/v2.1-validation-engine-test.js
          node --check tests/v2.1-publish-executor-test.js
          node --check tests/v2.1-asset-orchestrator-test.js
          node --check tests/v2.1-asset-repository-test.js
          node --check tests/v2.1-media-generation-test.js
          node -e "require('./src/providers/provider-contract'); require('./src/providers/provider-registry'); require('./src/providers/provider-gateway'); require('./worker/v2.1-production-orchestrator'); require('./worker/v2.1-structured-production'); require('./worker/v2.1-asset-orchestrator'); require('./worker/v2.1-media-generation'); require('./worker/v2.1-production-contract'); require('./worker/v2.1-execution-engine'); require('./worker/v2.1-stage-runner'); require('./worker/v2.1-pipeline-executor'); require('./worker/v2.1-recovery-executor'); require('./src/artifacts/artifact-service'); require('./src/v2.1/asset-repository'); require('./src/v2.1/reconciliation'); require('./src/v2.1/validation-engine'); require('./src/v2.1/publish-executor')"
        timeout-minutes: 2

      - name: Run provider-neutral generation contract certification
        run: npm run test:v2.1:provider-contract
        timeout-minutes: 2

      - name: Run V2.1 stage contract
        run: npm run test:v2.1:contract
        timeout-minutes: 2
      - name: Run provider-artifact-storage integration
        run: npm run test:v2.1:integration
        timeout-minutes: 3
      - name: Run provider routing certification
        run: npm run test:v2.1:routing
        timeout-minutes: 2
      - name: Run provider availability certification
        run: npm run test:v2.1:availability
        timeout-minutes: 2
      - name: Run single-stage execution certification
        run: npm run test:v2.1:single-stage
        timeout-minutes: 2
      - name: Run sequential pipeline executor certification
        run: npm run test:v2.1:pipeline-executor
        timeout-minutes: 2
      - name: Run execution-stage-provider-storage integration
        run: npm run test:v2.1:stage-runner
        timeout-minutes: 3
      - name: Run full V2.1 multi-stage integration
        run: npm run test:v2.1:multi-stage
        timeout-minutes: 3
      - name: Run PostgreSQL execution-stage integration
        run: npm run test:v2.1:stage-runner:postgres
        timeout-minutes: 3
      - name: Run PostgreSQL full multi-stage lifecycle
        run: npm run test:v2.1:multi-stage:postgres
        timeout-minutes: 5
      - name: Run PostgreSQL retry and lease recovery certification
        run: npm run test:v2.1:retry-recovery:postgres
        timeout-minutes: 3
      - name: Run PostgreSQL concurrency ownership certification
        run: npm run test:v2.1:concurrency:postgres
        timeout-minutes: 3
      - name: Run PostgreSQL lease fencing certification
        run: npm run test:v2.1:lease-fencing:postgres
        timeout-minutes: 3
      - name: Run artifact idempotency and concurrency certification
        run: npm run test:v2.1:artifact-idempotency
        timeout-minutes: 2
      - name: Run crash consistency certification
        run: npm run test:v2.1:crash-consistency
        timeout-minutes: 2
      - name: Run PostgreSQL crash recovery certification
        run: npm run test:v2.1:postgres-crash-recovery
        timeout-minutes: 3
      - name: Run reconciliation recovery certification
        run: npm run test:v2.1:reconciliation
        timeout-minutes: 2
      - name: Run recovery executor certification
        run: npm run test:v2.1:recovery-executor
        timeout-minutes: 2
      - name: Run V2.1 validation engine certification
        run: npm run test:v2.1:validation
        timeout-minutes: 2
      - name: Run V2.1 publish execution certification
        run: npm run test:v2.1:publish
        timeout-minutes: 2
      - name: Run V2.1 structured production planning certification
        run: npm run test:v2.1:production-orchestrator
        timeout-minutes: 3
      - name: Run V2.1 asset orchestrator certification
        run: npm run test:v2.1:asset-orchestrator
        timeout-minutes: 3
      - name: Run V2.1 asset repository certification
        run: npm run test:v2.1:asset-repository
        timeout-minutes: 2
      - name: Run V2.1 media generation certification
        run: npm run test:v2.1:media-generation
        timeout-minutes: 2

      - name: Check smoke test syntax
        run: node --check tests/smoke-test.js
        timeout-minutes: 2
      - name: Check build script syntax
        run: bash -n build-v2.sh
        timeout-minutes: 2
      - name: Check canonical migrations
        run: |
          test -s migrations/001_v2.sql
          test -s migrations/002_v2_1_execution.sql
          test -s migrations/20260819_v2_1_stage_input_propagation.sql
          test -s migrations/20260819_v2_1_retry_recovery.sql
          test -s migrations/20260820_v2_1_concurrency_certification.sql
          test -s migrations/20260820_v2_1_publication_execution.sql
          test -s migrations/20260821_v2_1_stage_claim_job_lease_fencing.sql
          test -s migrations/20260821_v2_1_asset_registry.sql
        timeout-minutes: 2
      - name: Check required project files
        run: |
          test -s package.json
          test -s package-lock.json
          test -s README.md
          test -s .env.example
        timeout-minutes: 2
      - name: Check Git whitespace
        run: git diff --check
        timeout-minutes: 2
