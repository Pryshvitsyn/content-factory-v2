name: Content Factory V2 CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "develop/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check worker syntax
        run: node --check worker/factory-worker-v2.js

      - name: Check V2.1 contract syntax
        run: node --check worker/v2.1-contracts.js

      - name: Check V2.1 production contract syntax
        run: node --check worker/v2.1-production-contract.js

      - name: Check V2.1 execution engine syntax
        run: node --check worker/v2.1-execution-engine.js

      - name: Check V2.1 IDEA generation syntax
        run: node --check worker/v2.1-idea-generation.js

      - name: Check V2.1 Bible contract syntax
        run: node --check worker/v2.1-bible-contract.js

      - name: Check V2.1 Bible validator syntax
        run: node --check worker/v2.1-bible-validator.js

      - name: Check V2.1 Bible engine syntax
        run: node --check worker/v2.1-bible-engine.js

      - name: Check V2.1 database context loader syntax
        run: node --check worker/v2.1-db-context-loader.js

      - name: Check V2.1 production boundary syntax
        run: node --check worker/v2.1-production-boundary.js

      - name: Check smoke test syntax
        run: node --check tests/smoke-test.js

      - name: Check V2.1 execution engine test syntax
        run: node --check tests/v2.1-execution-engine.test.js

      - name: Check V2.1 execution engine DB smoke syntax
        run: node --check tests/v2.1-execution-engine-db-smoke.js

      - name: Check V2.1 IDEA generation test syntax
        run: node --check tests/v2.1-idea-generation.test.js

      - name: Check V2.1 IDEA generation DB smoke syntax
        run: node --check tests/v2.1-idea-generation-db-smoke.js

      - name: Check V2.1 foundation test syntax
        run: node --check tests/v2.1-foundation.test.js

      - name: Check V2.1 production contract test syntax
        run: node --check tests/v2.1-production-contract.test.js

      - name: Check V2.1 Bible engine test syntax
        run: node --check tests/v2.1-bible-engine.test.js

      - name: Check V2.1 production context DB smoke syntax
        run: node --check tests/v2.1-production-context-db-smoke.js

      - name: Check V2.1 production boundary DB smoke syntax
        run: node --check tests/v2.1-production-boundary-db-smoke.js

      - name: Run V2.1 foundation tests
        run: node --test tests/v2.1-foundation.test.js

      - name: Run V2.1 production contract tests
        run: node --test tests/v2.1-production-contract.test.js

      - name: Run V2.1 execution engine tests
        run: node --test tests/v2.1-execution-engine.test.js

      - name: Run V2.1 IDEA generation tests
        run: node --test tests/v2.1-idea-generation.test.js

      - name: Run V2.1 Bible engine tests
        run: node --test tests/v2.1-bible-engine.test.js

      - name: Check build script syntax
        run: bash -n build-v2.sh

      - name: Check migrations exist
        run: |
          test -s migrations/001_v2.sql
          test -s migrations/20260815_v2_1_foundation.sql
          test -s migrations/20260815_v2_1_multi_business.sql
          test -s migrations/20260815_v2_1_production_boundary.sql
          test -s migrations/20260815_v2_1_production_boundary_patch.sql
          test -s migrations/20260815_v2_1_execution_engine.sql
          test -s migrations/20260816_v2_1_idea_generation_vertical_slice.sql

      - name: Check required project files
        run: |
          test -s package.json
          test -s package-lock.json
          test -s README.md
          test -s .env.example

      - name: Check Git whitespace
        run: git diff --check
