name: Content Factory V2 CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
      - "develop/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Check worker syntax
        run: node --check worker/factory-worker-v2.js
        timeout-minutes: 2

      - name: Check V2.1 integration syntax
        run: |
          node --check src/providers/provider-registry.js
          node --check src/providers/provider-gateway.js
          node --check src/artifacts/artifact-service.js
          node --check src/storage/storage-adapter.js
          node --check tests/v2.1-provider-artifact-integration-test.js
        timeout-minutes: 2

      - name: Run provider-artifact-storage integration
        run: npm run test:v2.1:integration
        timeout-minutes: 3

      - name: Check smoke test syntax
        run: node --check tests/smoke-test.js
        timeout-minutes: 2

      - name: Check build script syntax
        run: bash -n build-v2.sh
        timeout-minutes: 2

      - name: Check migration exists
        run: test -s migrations/001_v2.sql
        timeout-minutes: 2

      - name: Check required project files
        run: |
          test -s package.json
          test -s package-lock.json
          test -s README.md
          test -s .env.example
        timeout-minutes: 2

      - name: Check Git whitespace
        run: git diff --check
        timeout-minutes: 2
