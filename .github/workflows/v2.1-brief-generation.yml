name: Content Factory V2.1 BRIEF Generation

on:
  push:
    branches:
      - 'develop/**'
  pull_request:
    branches:
      - main
      - 'develop/**'

jobs:
  brief-generation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: n8n
          POSTGRES_DB: content_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n8n -d content_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: content_os
      PGUSER: n8n
      PGPASSWORD: n8n
      NVIDIA_MODEL: smoke-test-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate BRIEF worker syntax
        run: node --check worker/v2.1-brief-generation.js

      - name: Run BRIEF unit tests
        run: node --test tests/v2.1-brief-generation.test.js

      - name: Run BRIEF database smoke test
        run: node tests/v2.1-brief-generation-db-smoke.js
